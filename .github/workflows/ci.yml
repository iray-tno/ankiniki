name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Quality checks (lint + format + type-check) ──────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Build, type check, lint and format
        run: mise exec -- npm run check

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared
            workspace: packages/shared
          - name: backend
            workspace: packages/backend
          - name: cli
            workspace: apps/cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Build shared package
        run: mise exec -- npm run build -w packages/shared

      - name: Run tests
        run: mise exec -- npm test -w ${{ matrix.workspace }}
