name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Quality checks (lint + format + type-check) ──────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Build packages
        run: mise exec -- npm run build:packages

      - name: Type check
        run: mise exec -- npm run type-check

      - name: Lint and format
        run: mise exec -- npm run lint && mise exec -- npm run format:check

      - name: CLI exchange smoke test
        run: mise exec -- npm run test:exchange

      - name: Validate public lesson fixture
        run: mise exec -- node apps/cli/dist/index.js content validate docs/examples/content/basic-practice/content.json --public --json

  desktop:
    name: Desktop frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise exec -- npm ci
      - run: mise exec -- npm run build -w packages/shared
      - run: mise exec -- npm run build -w apps/desktop

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared
            workspace: packages/shared
          - name: backend
            workspace: packages/backend
          - name: cli
            workspace: apps/cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Build shared package
        run: mise exec -- npm run build -w packages/shared

      - name: Run tests
        run: mise exec -- npm test -w ${{ matrix.workspace }}
