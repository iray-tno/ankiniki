[package]
name = "ankiniki-desktop"
version = "0.1.0"
description = "Ankiniki desktop application"
authors = ["Ankiniki Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ankiniki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
